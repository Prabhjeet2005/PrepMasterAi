<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mic Test</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <h1>🎤 Microphone Test</h1>
    <button id="startBtn">Start Recording</button>
    <p id="status">Status: Disconnected</p>
    <div id="output" style="border:1px solid #ccc; padding:10px; min-height:100px;"></div>

    <script>
        const socket = io("http://localhost:5001");
        let mediaRecorder;
        let isAiSpeaking = false; // <--- NEW FLAG

        socket.on("connect", () => {
            document.getElementById("status").innerText = "Status: Connected ✅";
        });

        socket.on("transcript-result", (text) => {
            document.getElementById("output").innerText += text + " ";
        });

        // UPDATED: Handle AI Response
        socket.on("ai-response", (text) => {
            // 1. Mark AI as speaking
            isAiSpeaking = true; 
            document.getElementById("status").innerText = "Status: 🤖 AI Speaking (Mic Paused)";
            
            const box = document.getElementById("output");
            box.innerHTML += `<br><strong>🤖 AI:</strong> ${text}<br>`;
            
            const utterance = new SpeechSynthesisUtterance(text);
            
            // 2. When AI finishes talking, turn Mic back on
            utterance.onend = () => {
                isAiSpeaking = false;
                document.getElementById("status").innerText = "Status: 🔴 Recording...";
            };
            
            window.speechSynthesis.speak(utterance);
        });

        document.getElementById("startBtn").onclick = async () => {
            socket.emit("start-interview");
            document.getElementById("status").innerText = "Status: 🔴 Recording...";

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

            mediaRecorder.ondataavailable = (event) => {
                // 3. ONLY SEND IF AI IS NOT SPEAKING
                if (event.data.size > 0 && !isAiSpeaking) {
                    socket.emit("audio-stream", event.data);
                }
            };

            mediaRecorder.start(250);
        };
    </script>
</body>
</html>
